<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika Pecahan - Kelas 4</title>
<style>
  :root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;
    --success:#10b981;
    --success-light:#d1fae5;
    --danger:#ef4444;
    --danger-light:#fee2e2;
    --warning:#f59e0b;
    --warning-light:#fef3c7;
    --bg:#f0f4ff;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 10px 30px rgba(99,102,241,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:linear-gradient(135deg,#a5b4fc 0%,#c7d2fe 50%,#e0e7ff 100%);
    min-height:100vh;
    padding:20px;
    color:var(--text);
    line-height:1.6;
  }
  .container{max-width:820px;margin:0 auto}

  /* HEADER */
  .header{
    background:var(--card);
    border-radius:20px;
    padding:28px 32px;
    box-shadow:var(--shadow);
    text-align:center;
    margin-bottom:20px;
  }
  .header h1{
    font-size:1.8rem;
    color:var(--primary-dark);
    margin-bottom:6px;
  }
  .header p{color:var(--muted);font-size:.95rem}

  /* CARDS */
  .card{
    background:var(--card);
    border-radius:18px;
    padding:28px 30px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .card h2{
    color:var(--primary-dark);
    font-size:1.3rem;
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:2px dashed var(--border);
  }

  /* FORM IDENTITY */
  .form-group{margin-bottom:16px}
  .form-group label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:var(--text);
    font-size:.95rem;
  }
  .form-group input,.form-group select{
    width:100%;
    padding:12px 14px;
    border:2px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    background:#fff;
    transition:.2s;
  }
  .form-group input:focus,.form-group select:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
  }

  /* BUTTONS */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 26px;
    border:none;
    border-radius:12px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    font-family:inherit;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px)}
  .btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;transform:none}
  .btn-success{background:var(--success);color:#fff}
  .btn-success:hover{background:#059669;transform:translateY(-2px)}
  .btn-warning{background:var(--warning);color:#fff}
  .btn-warning:hover{background:#d97706;transform:translateY(-2px)}
  .btn-secondary{background:#e2e8f0;color:var(--text)}
  .btn-secondary:hover{background:#cbd5e1}
  .btn-block{width:100%;margin-top:10px}
  .btn-lg{padding:15px 34px;font-size:1.1rem}

  /* PROGRESS BAR */
  .progress-wrap{margin-bottom:20px}
  .progress-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:.9rem;
    color:var(--muted);
    font-weight:600;
  }
  .progress-bar{
    height:14px;
    background:var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary),#818cf8);
    border-radius:8px;
    transition:width .4s ease;
    width:0;
  }
  .badge-identity{
    background:var(--success-light);
    color:#065f46;
    padding:6px 14px;
    border-radius:20px;
    font-size:.85rem;
    font-weight:600;
  }

  /* QUESTION CARD */
  .q-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:6px;
  }
  .q-num{
    background:var(--primary);
    color:#fff;
    width:44px;height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:1.1rem;
    flex-shrink:0;
  }
  .q-type{
    background:#eef2ff;
    color:var(--primary-dark);
    padding:4px 12px;
    border-radius:14px;
    font-size:.78rem;
    font-weight:600;
  }
  .q-text{
    font-size:1.12rem;
    margin:8px 0 18px;
    color:var(--text);
  }
  .q-sub{margin-left:0}

  /* FRACTION DISPLAY */
  .frac{
    display:inline-flex;
    flex-direction:column;
    vertical-align:middle;
    text-align:center;
    margin:0 4px;
    font-size:1em;
  }
  .frac .num{border-bottom:2px solid var(--text);padding:0 6px 2px}
  .frac .den{padding:2px 6px 0}

  /* OPTIONS (multiple choice) */
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .option{
    background:#fff;
    border:2px solid var(--border);
    border-radius:12px;
    padding:14px 18px;
    cursor:pointer;
    transition:.2s;
    font-size:1.05rem;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .option:hover{border-color:var(--primary);background:#f5f3ff}
  .option .opt-label{
    background:var(--primary);
    color:#fff;
    width:32px;height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
    font-size:.9rem;
  }
  .option.selected{border-color:var(--primary);background:#eef2ff}
  .option.selected .opt-label{background:var(--primary-dark)}
  .option.correct{border-color:var(--success);background:var(--success-light)}
  .option.correct .opt-label{background:var(--success)}
  .option.wrong{border-color:var(--danger);background:var(--danger-light)}
  .option.wrong .opt-label{background:var(--danger)}
  .option.disabled{cursor:not-allowed;opacity:.65}

  /* MC MULTI (kompleks) */
  .mc-multi-hint{
    background:#fff8e1;border:1px solid #ffe082;border-left:4px solid var(--warning);
    border-radius:8px;padding:10px 14px;margin:8px 0 14px;
    font-size:.9rem;color:#7a5a00;
  }
  .options.multi .option{align-items:center}
  .opt-check{
    font-size:1.25rem;color:var(--primary);font-weight:700;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;border:2px solid var(--primary);background:#fff;margin-right:8px;flex-shrink:0;
    transition:.15s;
  }
  .options.multi .option.selected .opt-check{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
  .options.multi .option.correct .opt-check{background:var(--success);color:#fff;border-color:var(--success)}
  .options.multi .option.wrong .opt-check{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* TRUE/FALSE */
  .tf-options{display:flex;gap:14px;flex-wrap:wrap}
  .tf-btn{
    flex:1;min-width:140px;
    padding:16px;
    border:2px solid var(--border);
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    font-size:1.05rem;
    font-weight:600;
    transition:.2s;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .tf-btn:hover{border-color:var(--primary);background:#f5f3ff}
  .tf-btn.selected{border-color:var(--primary);background:#eef2ff}
  .tf-btn.correct{border-color:var(--success);background:var(--success-light);color:#065f46}
  .tf-btn.wrong{border-color:var(--danger);background:var(--danger-light);color:#991b1b}
  .tf-icon{font-size:1.3rem}

  /* SHORT ANSWER */
  .input-answer{
    width:100%;
    padding:14px 16px;
    border:2px solid var(--border);
    border-radius:10px;
    font-size:1.1rem;
    text-align:center;
    letter-spacing:1px;
    transition:.2s;
  }
  .input-answer:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
  }

  /* FRACTION INPUT */
  .frac-input{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    border:2px solid var(--border);
    border-radius:10px;
    padding:6px 10px;
    background:#fff;
  }
  .frac-input input{
    width:70px;
    border:none;
    text-align:center;
    font-size:1.1rem;
    padding:6px;
    background:transparent;
  }
  .frac-input input:focus{outline:none;background:#eef2ff;border-radius:6px}
  .frac-input .frac-line{
    width:100%;
    height:2px;
    background:var(--text);
    margin:2px 0;
  }

  /* SUB-QUESTION GRID */
  .sub-q{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .sub-q-label{
    font-weight:600;
    margin-bottom:10px;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sub-q-label .sub-letter{
    background:var(--primary);
    color:#fff;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;
    font-weight:700;
  }
  .sub-status{
    margin-left:auto;
    font-size:.8rem;
    padding:3px 10px;
    border-radius:12px;
    font-weight:600;
  }
  .sub-status.done{background:var(--success-light);color:#065f46}
  .sub-status.pending{background:#fef3c7;color:#92400e}

  /* DRAG & DROP */
  .drag-area{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding:8px;background:#eef2ff;border-radius:10px;border:1px dashed var(--primary)}
  .draggable{
    background:#fff;
    border:2px solid var(--primary);
    color:var(--primary-dark);
    padding:10px 16px;
    border-radius:10px;
    cursor:grab;
    font-size:1.05rem;
    font-weight:600;
    user-select:none;
    transition:.15s;
    box-shadow:0 2px 4px rgba(99,102,241,.15);
  }
  .draggable::before{content:'⠿ ';color:var(--primary);font-weight:700;opacity:.6}
  .draggable:active{cursor:grabbing;opacity:.6;transform:scale(.97)}
  .draggable.dragging{opacity:.4;border-style:dashed}
  .drop-zone{
    min-height:64px;
    border:2px dashed var(--primary);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    background:linear-gradient(135deg,#fafbff,#f0f4ff);
    transition:.2s;
  }
  .drop-zone.over{border-color:var(--success);background:var(--success-light);border-style:solid}
  .drop-zone .placeholder{color:var(--muted);font-style:italic}
  .order-num{
    background:var(--warning);
    color:#fff;
    width:26px;height:26px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;justify-content:center;
    font-size:.85rem;
    font-weight:700;
    margin-right:6px;
  }

  /* FEEDBACK */
  .feedback{
    margin-top:18px;
    padding:16px 18px;
    border-radius:12px;
    font-weight:500;
    display:none;
    align-items:flex-start;
    gap:12px;
    line-height:1.6;
  }
  .feedback.show{display:flex;animation:pop .35s ease}
  .feedback.correct{background:var(--success-light);color:#065f46;border-left:4px solid var(--success)}
  .feedback.wrong{background:var(--danger-light);color:#991b1b;border-left:4px solid var(--danger)}
  .feedback .emoji{font-size:1.8rem;flex-shrink:0;line-height:1}
  .feedback strong{display:block;margin-bottom:4px;font-size:1.05rem}

  /* ATTEMPT BADGE */
  .attempt-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--border);
    font-size:.85rem;
    color:var(--muted);
  }
  .attempt-badge{
    background:#fef3c7;
    color:#92400e;
    padding:4px 12px;
    border-radius:12px;
    font-weight:600;
  }
  .attempt-badge.used{background:var(--danger-light);color:#991b1b}

  /* RESULT */
  .result-card{text-align:center;padding:40px 30px}
  .result-emoji{font-size:5rem;margin-bottom:10px;animation:bounce 1s ease infinite}
  .result-title{font-size:2rem;color:var(--primary-dark);margin-bottom:8px}
  .result-score{
    font-size:3.5rem;
    font-weight:800;
    color:var(--primary);
    margin:14px 0;
  }
  .result-score .max{font-size:1.5rem;color:var(--muted);font-weight:500}
  .result-detail{
    background:#f8fafc;
    border-radius:12px;
    padding:16px;
    margin:18px 0;
    color:var(--muted);
    font-size:.95rem;
  }
  .review-list{text-align:left;margin-top:16px}
  .review-item{
    display:flex;
    justify-content:space-between;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:6px;
    background:#f8fafc;
    font-size:.92rem;
  }
  .review-item .rstatus{font-weight:600}
  .review-item .rstatus.ok{color:var(--success)}
  .review-item .rstatus.no{color:var(--danger)}
  .review-item .rstatus.retry{color:var(--warning);font-weight:700}

  /* HIDDEN */
  .hidden{display:none!important}

  /* ANIMATIONS */
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s ease}

  @media(max-width:600px){
    .options{grid-template-columns:1fr}
    .header h1{font-size:1.4rem}
    .card{padding:20px}
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🍎 Kuis Matematika Pecahan</h1>
    <p>Belajar Pecahan Jadi Menyenangkan — Sekolah Dasar Kelas 4</p>
  </div>

  <!-- IDENTITY -->
  <div class="card" id="identityCard">
    <h2>👤 Identitas Siswa</h2>
    <div class="form-group">
      <label for="studentName">Nama Lengkap</label>
      <input type="text" id="studentName" placeholder="Tulis nama lengkapmu di sini" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="studentClass">Kelas</label>
      <select id="studentClass">
        <option value="">-- Pilih Kelas --</option>
        <option value="4A">Kelas 4A</option>
        <option value="4B">Kelas 4B</option>
        <option value="4C">Kelas 4C</option>
        <option value="4D">Kelas 4D</option>
      </select>
    </div>
    <button class="btn btn-primary btn-lg btn-block" id="startBtn">Mulai Kuis 🚀</button>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px">
      Isi dulu nama dan kelasmu sebelum memulai ya!
    </p>
  </div>

  <!-- PROGRESS + QUESTION -->
  <div class="hidden" id="quizArea">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">Soal 1 dari 10</span>
        <span class="badge-identity" id="identityBadge">Nama • Kelas</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card" id="questionCard"><!-- diisi JS --></div>
  </div>

  <!-- RESULT -->
  <div class="hidden" id="resultArea">
    <div class="card result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 class="result-title" id="resultTitle">Kerja Bagus!</h2>
      <div class="result-score"><span id="finalScore">0</span><span class="max"> / 100</span></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="review-list" id="reviewList"></div>
      <button class="btn btn-secondary btn-block" id="restartBtn" style="margin-top:18px">Ulang Kuis 🔄</button>
    </div>
  </div>

</div>

<script>
/* ===================== DATA SOAL ===================== */
// Setiap soal punya: id, type, question, tipeLabel, poin
// type: 'compare' (pilih tanda), 'order' (drag-drop urut), 'word' (cerita isian),
//       'mc' (pilihan ganda), 'tf' (benar-salah), 'frac' (input pecahan senilai)
const QUESTIONS = [
  /* SOAL 1 — dari gambar, membandingkan pecahan */
  {
    id:1, type:'compare', tipeLabel:'Isian: Pilih Tanda', poin:10,
    question:'Bandingkan 2 pecahan di bawah ini dengan tanda <, =, atau >!',
    subs:[
      {letter:'a', left:{n:1,d:3}, right:{n:1,d:1}, answer:'<'},
      {letter:'b', left:{n:1,d:7}, right:{n:1,d:5}, answer:'<'},
      {letter:'c', left:{n:5,d:9}, right:{n:3,d:9}, answer:'>'},
      {letter:'d', left:{n:2,d:6}, right:{n:3,d:6}, answer:'<'},
      {letter:'e', left:{n:11,d:17}, right:{n:3,d:17}, answer:'>'}
    ]
  },
  /* SOAL 2 — dari gambar, urutkan pecahan (arah bervariasi) */
  {
    id:2, type:'order', tipeLabel:'Urutkan: Drag & Drop', poin:10,
    question:'Urutkan pecahan berikut sesuai arah yang ditentukan pada tiap bagian!',
    subs:[
      {letter:'a', dir:'asc',  items:['1/3','1/2','1/4'],   answer:'1/4,1/3,1/2'},
      {letter:'b', dir:'desc', items:['1/13','1/17','1/21'], answer:'1/13,1/17,1/21'},
      {letter:'c', dir:'asc',  items:['5/8','2/8','7/8'],   answer:'2/8,5/8,7/8'},
      {letter:'d', dir:'desc', items:['6/7','3/7','7/7'],   answer:'7/7,6/7,3/7'},
      {letter:'e', dir:'desc', items:['12/16','15/16','14/16'], answer:'15/16,14/16,12/16'}
    ]
  },
  /* SOAL 3 — dari gambar, cerita semangka */
  {
    id:3, type:'word', tipeLabel:'Soal Cerita (Isian)', poin:10,
    question:'Ibu mempunyai satu buah semangka. Seperempatnya diberikan kepada Helen. Sisanya diberikan kepada Putu.',
    subs:[
      {letter:'a', text:'Berapa bagiankah semangka yang diterima Helen dan Putu? (jumlahkan)', answerType:'frac', answer:{n:1,d:1}, accept:['1','1/1','4/4'], hint:'Helen 1/4 + Putu sisanya 3/4 = ?'},
      {letter:'b', text:'Siapakah yang menerima bagian semangka paling besar? (tulis nama)', answerType:'text', answer:'putu', hint:'Bandingkan 1/4 (Helen) dengan 3/4 (Putu)'}
    ]
  },
  /* SOAL 4 — dari gambar, cerita roti (pilihan ganda) */
  {
    id:4, type:'mc', tipeLabel:'Soal Cerita (Pilihan Ganda)', poin:10,
    question:'Bibi membagikan 1/3 bagian roti kepada Wiwin. Sedangkan 2/3 bagian kepada Tomas. Siapakah yang menerima bagian roti paling sedikit?',
    options:['Wiwin','Tomas','Sama banyak','Tidak ada yang menerima'],
    correct:0
  },
  /* SOAL 5 — pecahan senilai (pilihan ganda kompleks: senilai dengan 3/4) */
  {
    id:5, type:'mc_multi', tipeLabel:'Pecahan Senilai (Pilihan Ganda Kompleks)', poin:10,
    question:'Perhatikan pecahan 3/4. Pilih SEMUA pecahan yang SENILAI dengan 3/4! (ingat: kalikan atau bagikan pembilang & penyebut dengan bilangan yang sama. Bisa lebih dari satu jawaban benar.)',
    options:['2/3','6/8','9/12','5/6'],
    correct:[1,2]
  },
  /* SOAL 6 — pecahan senilai (isian terbuka: kalikan, jawab pecahan senilai LAIN) */
  {
    id:6, type:'frac', tipeLabel:'Pecahan Senilai (Isian Pecahan)', poin:10,
    question:'Tuliskan SATU pecahan yang SENILAI dengan 2/5, dengan cara MENGALIKAN pembilang & penyebut dengan bilangan yang sama! (Contoh: kalikan dengan 2, 3, atau 5. Jawaban harus pecahan lain, bukan 2/5 sendiri.)',
    answer:{n:2,d:5}, excludeSelf:true
  },
  /* SOAL 7 — pecahan senilai (pilihan ganda kompleks: senilai dengan 8/12) */
  {
    id:7, type:'mc_multi', tipeLabel:'Pecahan Senilai (Pilihan Ganda Kompleks)', poin:10,
    question:'Perhatikan pecahan 8/12. Pilih SEMUA pecahan yang SENILAI dengan 8/12! (ingat: kalikan atau bagikan pembilang & penyebut dengan bilangan yang sama. Bisa lebih dari satu jawaban benar.)',
    options:['2/3','4/6','6/8','3/5'],
    correct:[0,1]
  },
  /* SOAL 8 — pecahan senilai (benar-salah) */
  {
    id:8, type:'tf', tipeLabel:'Pecahan Senilai (Benar/Salah)', poin:10,
    question:'Pernyataan: pecahan 6/8 dan 9/12 adalah pecahan yang SENILAI. (periksa apakah kedua pecahan bernilai sama)',
    answer:true
  },
  /* SOAL 9 — cerita: pecahan senilai dalam konteks (bukan penjumlahan beda penyebut) */
  {
    id:9, type:'word', tipeLabel:'Soal Cerita (Isian)', poin:10,

function renderQuestion(){
  const q=QUESTIONS[state.current];
  const card=$('#questionCard');
  card.style.animation='pop .3s ease';
  setTimeout(()=>card.style.animation='',350);

  let body='';
  // header
  body+=`<div class="q-header">
    <div class="q-num">${state.current+1}</div>
    <span class="q-type">${q.tipeLabel} • ${q.poin} poin</span>
  </div>`;
  body+=`<div class="q-text">${q.question}</div>`;

  // body by type
  if(q.type==='compare') body+=renderCompare(q);
  else if(q.type==='order') body+=renderOrder(q);
  else if(q.type==='mc') body+=renderMC(q);
  else if(q.type==='mc_multi') body+=renderMCmulti(q);
  else if(q.type==='tf') body+=renderTF(q);
  else if(q.type==='frac') body+=renderFrac(q);
  else if(q.type==='word') body+=renderWord(q);

  // feedback area + button + attempt info
  body+=`<div class="feedback" id="feedback"></div>`;

}

function attachQuestionHandlers(q){

      });

/* ---------- DRAG DROP ---------- */
function setupDragDrop(q){
  let dragged=null;
  document.querySelectorAll('.draggable').forEach(d=>{
    d.addEventListener('dragstart',e=>{
      dragged=d; d.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragged=null;});
  });
  document.querySelectorAll('.drop-zone, .drag-area').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();
      zone.classList.remove('over');
      if(!dragged) return;
      // remove placeholder
      const ph=zone.querySelector('.placeholder'); if(ph) ph.remove();
      // if drop into a drop-zone, place based on cursor (X within row, Y across rows)
      const after=getDragAfterElement(zone,e.clientX,e.clientY);
      if(after==null) zone.appendChild(dragged);
      else zone.insertBefore(dragged,after);
      zone.dispatchEvent(new Event('drag-update'));
      // also update source pool if dropping back
      const pool=document.querySelector(`.drag-area[data-pool="${zone.dataset.zone}"]`);
    });
  });
}
function getDragAfterElement(container,x,y){
  const els=[...container.querySelectorAll('.draggable:not(.dragging)')];
  if(els.length===0) return null;
  // First find the row the cursor is in (by Y).
  // Group items into rows by their top position.
  let rowTop=null;
  for(const child of els){
    const box=child.getBoundingClientRect();
    if(y>=box.top && y<=box.bottom){ rowTop=box.top; break; }
  }
  // If cursor is below all rows, target the last row; if above all, target first row.
  if(rowTop===null){
    const boxes=els.map(c=>c.getBoundingClientRect());
    const minY=Math.min(...boxes.map(b=>b.top));
    const maxY=Math.max(...boxes.map(b=>b.bottom));
    rowTop = (y<minY) ? boxes[0].top : boxes[boxes.length-1].top;
  }
  // Now within that row, find the element whose left edge is past the cursor.
  // Among items in the same row (top≈rowTop), return the first one with center > x.
  const rowEls=els.filter(c=>{
    const b=c.getBoundingClientRect();
    return Math.abs(b.top-rowTop)<5; // same row (tolerance 5px)
  });
  let after=null, closestX=Infinity;
  for(const child of rowEls){
    const box=child.getBoundingClientRect();
    const center=box.left+box.width/2;
    if(x<center && center-x<closestX){ closestX=center-x; after=child; }
  }
  // If cursor is past the right edge of all items in the row, return null so item appends to end.
  if(after===null){
    // Append only if the cursor is in (or after) the last row.
    const lastBox=rowEls[rowEls.length-1].getBoundingClientRect();
    if(Math.abs(rowTop-lastBox.top)<5 && x>lastBox.right) return null;
    // Otherwise (cursor in an empty row below), still append.
    return null;
  }
  return after;
}
function updateOrderStatus(q){
  q.subs.forEach((s,i)=>{
    const zone=document.querySelector(`.drop-zone[data-zone="${i}"]`);
    const placed=zone.querySelectorAll('.draggable').length;
    const st=document.querySelector(`.sub-status[data-status="${i}"]`);
    if(placed===s.items.length){st.textContent='sudah urut';st.classList.remove('pending');st.classList.add('done');}
    else {st.textContent=`${placed}/${s.items.length} terisi`;st.classList.add('pending');st.classList.remove('done');}
  });
}

/* ===================== CHECK ANSWER ===================== */
function checkAnswer(q){
  // cek apakah sudah diisi
  if(!isFilled(q)){showFeedback('wrong','⚠️ Oops!','Isi dulu semua jawabanmu sebelum diperiksa ya!');return;}

  // init answer record jika belum ada
  if(!state.answers[state.current]) state.answers[state.current]={attempts:0,usedRetry:false};
  const rec=state.answers[state.current];
  rec.attempts++;

  const correct=evaluateAnswer(q);
  rec.correct=correct;

  // tampilkan feedback + tandai visual
  const isFinal = correct || rec.attempts>=2;
  markVisual(q,correct,isFinal);
  const fb=$('#feedback');
  if(correct){
    fb.className='feedback show correct';
    fb.innerHTML=`<span class="emoji">🎉</span><div><strong>Benar! ${rand(praise)}</strong>${
      rec.usedRetry
        ? `Kamu sempat mengulang sekali, jadi skor soal ini dikurangi 2. Skor: ${q.poin-2} dari ${q.poin}.`
        : `Skor penuh: ${q.poin} dari ${q.poin}. Lanjut ke soal berikutnya!`
    }</div>`;
    state.answers[state.current].score=rec.usedRetry?q.poin-2:q.poin;
    $('#attemptBadge').textContent=`Percobaan: ${rec.attempts} (berhasil)`;
    $('#attemptBadge').classList.remove('used');
    $('#checkBtn').classList.add('hidden');
    $('#nextBtn').classList.remove('hidden');
    disableInputs(q);
  } else {
    fb.className='feedback show wrong';
    if(rec.attempts>=2){
      // sudah 2x salah -> wajib lanjut (tidak bisa lanjut sebelumnya, tapi di sini salah max)
      fb.innerHTML=`<span class="emoji">💙</span><div><strong>Belum tepat setelah 2x percobaan.</strong>${rand(encouragement)} Kunci jawaban: <b>${getAnswerKey(q)}</b>. Yuk lanjut ke soal berikutnya, jangan menyerah! Skor: 0 dari ${q.poin}.</div>`;
      state.answers[state.current].score=0;
      $('#attemptBadge').textContent=`Percobaan: ${rec.attempts} (maksimal)`;
      $('#attemptBadge').classList.add('used');
      $('#checkBtn').classList.add('hidden');
      $('#nextBtn').classList.remove('hidden');
      disableInputs(q);
      showCorrectAnswers(q);
    } else {
      // masih boleh ulang 1x
      rec.usedRetry=true;
      fb.innerHTML=`<span class="emoji">🌱</span><div><strong>${rand(encouragement)}</strong>Kamu masih punya <b>1 kesempatan lagi</b> untuk mengulang. Ingat: jika berhasil di percobaan kedua, skor soal ini akan dikurangi 2 (jadi ${q.poin-2} dari ${q.poin}). Perbaiki jawabanmu lalu klik "Periksa Jawaban" lagi ya!</div>`;
      $('#attemptBadge').textContent=`Percobaan: ${rec.attempts} (ulangi sekali lagi)`;
      $('#attemptBadge').classList.add('used');
      // reset tanda visual agar siswa bisa memilih ulang (mc/tf)
      resetVisualForRetry(q);
      // sembunyikan feedback sebelumnya? tidak, biarkan agar siswa tahu pesan
    }
  }
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function isFilled(q){
  if(q.type==='compare'){
    let ok=true;
    q.subs.forEach((s,i)=>{
      const v=document.querySelector(`.cmp-select[data-sub="${i}"]`).value;
      if(!v) ok=false;
    });
    return ok;
  }
  if(q.type==='order'){
    let ok=true;
    q.subs.forEach((s,i)=>{
      const z=document.querySelector(`.drop-zone[data-zone="${i}"]`);
      if(z.querySelectorAll('.draggable').length!==s.items.length) ok=false;
    });
    return ok;
  }
  if(q.type==='mc') return !!document.querySelector('.option.selected');
  if(q.type==='mc_multi') return !!document.querySelector('.option[data-multi="1"].selected');
  if(q.type==='tf') return !!document.querySelector('.tf-btn.selected');
  if(q.type==='frac') return $('#fracNum').value.trim()!=='' && $('#fracDen').value.trim()!=='';
  if(q.type==='word'){
    if(!q.subs){
      return $('#wordInput').value.trim()!=='';
    }
    let ok=true;
    q.subs.forEach((s,i)=>{
      const inputs=document.querySelectorAll(`[data-subinput="${i}"]`);
      if(s.answerType==='frac'){
        const n=inputs[0].value.trim(), d=inputs[1].value.trim();
        if(!n||!d) ok=false;
      } else {
        if(!inputs[0].value.trim()) ok=false;
      }
    });
    return ok;
  }
  return true;
}

function evaluateAnswer(q){
  if(q.type==='compare'){
    return q.subs.every((s,i)=>document.querySelector(`.cmp-select[data-sub="${i}"]`).value===s.answer);
  }
  if(q.type==='order'){
    return q.subs.every((s,i)=>{
      const z=document.querySelector(`.drop-zone[data-zone="${i}"]`);
      const arr=[...z.querySelectorAll('.draggable')].map(d=>d.dataset.val);
      return arr.join(',')===s.answer;
    });
  }
  if(q.type==='mc'){
    const sel=document.querySelector('.option.selected');
    return sel && parseInt(sel.dataset.idx)===q.correct;
  }
  if(q.type==='mc_multi'){
    // kumpulkan idx yang dipilih siswa
    const chosen=[...document.querySelectorAll('.option[data-multi="1"].selected')]
      .map(o=>parseInt(o.dataset.idx)).sort((a,b)=>a-b);
    // kunci: q.correct berupa array of idx
    const key=[...q.correct].sort((a,b)=>a-b);
    if(chosen.length!==key.length) return false;
    return chosen.every((v,i)=>v===key[i]);
  }
  if(q.type==='tf'){
    const sel=document.querySelector('.tf-btn.selected');
    return sel && (sel.dataset.val==='true')===q.answer;
  }
  if(q.type==='frac'){
    return fracMatch($('#fracNum').value.trim(), $('#fracDen').value.trim(), q.answer, q.accept, q.excludeSelf, q.exact);
  }
  if(q.type==='word'){
    if(!q.subs){
      return normalizeText($('#wordInput').value)===normalizeText(q.answer);
    }
    return q.subs.every((s,i)=>{
      const inputs=document.querySelectorAll(`[data-subinput="${i}"]`);
      if(s.answerType==='frac'){
        return fracMatch(inputs[0].value.trim(), inputs[1].value.trim(), s.answer, s.accept, s.excludeSelf, s.exact);
      } else {
        return normalizeText(inputs[0].value)===normalizeText(s.answer);
      }
    });
  }
  return false;
}

function fracMatch(n,d,ans,accept,excludeSelf,exact){
  n=String(n).trim().replace(/\s/g,''); d=String(d).trim().replace(/\s/g,'');
  const user=`${n}/${d}`;
  const original=`${ans.n}/${ans.d}`;
  // mode exact: hanya menerima bentuk persis sama dengan ans atau salah satu accept
  if(exact){
    if(user===original) return true;
    if(accept) return accept.map(a=>a.replace(/\s/g,'')).includes(user);
    return false;
  }
  // soal "sebut pecahan senilai LAIN": tolak bentuk asli
  if(excludeSelf && user===original) return false;
  // cek bentuk utama
  if(user===original) return true;
  // cek accept list
  if(accept){
    const acc=accept.map(a=>a.replace(/\s/g,''));
    if(acc.includes(user)) return true;
    // cek senilai
    for(const a of acc){
      const [an,ad]=a.split('/').map(Number);
      if(an===+n && ad===+d) return true;
      // senilai: n/d = an/ad
      if(+n*ad === an*+d && +d!==0 && ad!==0) return true;
    }
  }
  // cek senilai dengan ans
  return (+n)*ans.d === ans.n*(+d) && +d!==0;
}

function normalizeText(s){
  return String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,!?]/g,'');
}

/* ---------- VISUAL MARKING ---------- */
function markVisual(q,correct,isFinal){
  if(q.type==='mc'){
    const sel=document.querySelector('.option.selected');
    if(correct){sel.classList.add('correct');}
    else {
      sel.classList.add('wrong');
      if(isFinal){
        const c=document.querySelectorAll('.option')[q.correct];
        c.classList.add('correct');
      }
    }
    if(isFinal) document.querySelectorAll('.option').forEach(o=>o.classList.add('disabled'));
  }
  if(q.type==='mc_multi'){
    const key=new Set(q.correct);
    const opts=document.querySelectorAll('.option[data-multi="1"]');
    opts.forEach(o=>{
      const idx=parseInt(o.dataset.idx);
      if(o.classList.contains('selected')){
        // siswa pilih -> benar kalau ada di kunci, salah kalau tidak
        if(key.has(idx)) o.classList.add('correct');
        else o.classList.add('wrong');
      } else {
        // siswa tidak pilih -> kalau ada di kunci & sudah final, tunjukkan jawaban benar
        if(isFinal && key.has(idx)) o.classList.add('correct');
      }
    });
    if(isFinal) opts.forEach(o=>o.classList.add('disabled'));
  }
  if(q.type==='tf'){
    const sel=document.querySelector('.tf-btn.selected');
    if(correct) sel.classList.add('correct');
    else {
      sel.classList.add('wrong');
      if(isFinal){
        document.querySelector(`.tf-btn[data-val="${q.answer}"]`).classList.add('correct');
      }
    }
    if(isFinal) document.querySelectorAll('.tf-btn').forEach(o=>o.disabled=true);
  }
  if(q.type==='compare'){
    q.subs.forEach((s,i)=>{
      const sel=document.querySelector(`.cmp-select[data-sub="${i}"]`);
      const st=document.querySelector(`.sub-status[data-status="${i}"]`);
      if(sel.value===s.answer){st.textContent='✓ benar';st.className='sub-status done';}
      else {st.textContent='✗ salah';st.className='sub-status pending';st.style.background='var(--danger-light)';st.style.color='#991b1b';}
    });
  }
  if(q.type==='order'){
    q.subs.forEach((s,i)=>{
      const z=document.querySelector(`.drop-zone[data-zone="${i}"]`);
      const arr=[...z.querySelectorAll('.draggable')].map(d=>d.dataset.val);
      const st=document.querySelector(`.sub-status[data-status="${i}"]`);
      if(arr.join(',')===s.answer){st.textContent='✓ benar';st.className='sub-status done';}
      else {st.textContent='✗ salah';st.style.background='var(--danger-light)';st.style.color='#991b1b';}
    });
  }
}

/* Reset visual marking untuk percobaan ulang (hilangkan tanda wrong/correct) */
function resetVisualForRetry(q){
  if(q.type==='mc'){
    document.querySelectorAll('.option').forEach(o=>{
      o.classList.remove('wrong','correct','selected','disabled');
      o.style.pointerEvents='';

    document.querySelectorAll('.tf-btn').forEach(o=>{
      o.classList.remove('wrong','correct','selected');
      o.disabled=false;

  if(q.type==='compare'){

  }
  if(q.type==='order'){
    // biarkan, siswa bisa seret ulang
  }
  if(q.type==='frac'){
    // biarkan input tetap, siswa edit
  }
  if(q.type==='word'){
    // biarkan input tetap, siswa edit
  }
}

function disableInputs(q){
  if(q.type==='mc') document.querySelectorAll('.option').forEach(o=>o.style.pointerEvents='none');
  if(q.type==='tf') document.querySelectorAll('.tf-btn').forEach(o=>o.style.pointerEvents='none');
  if(q.type==='compare') document.querySelectorAll('.cmp-select').forEach(s=>s.disabled=true);
  if(q.type==='order') document.querySelectorAll('.draggable').forEach(d=>d.draggable=false);
  if(q.type==='frac'){document.getElementById('fracNum').disabled=true;document.getElementById('fracDen').disabled=true;}
  if(q.type==='word'){
    document.querySelectorAll('[data-subinput]').forEach(i=>i.disabled=true);
    const w=document.getElementById('wordInput'); if(w) w.disabled=true;
  }
}

function showCorrectAnswers(q){
  if(q.type==='compare'){
    q.subs.forEach((s,i)=>{
      const sel=document.querySelector(`.cmp-select[data-sub="${i}"]`);
      if(sel.value!==s.answer){
        sel.style.borderColor='var(--danger)';
        // tambahkan info
        const st=document.querySelector(`.sub-status[data-status="${i}"]`);
        st.textContent=`kunci: ${s.answer}`;
      }
    });
  }
  if(q.type==='order'){
    // tidak mengubah, sudah ditandai
  }
  if(q.type==='frac'){
    const n=$('#fracNum'),d=$('#fracDen');
    if(!fracMatch(n.value,d.value,q.answer)){
      n.style.borderColor='var(--danger)';d.style.borderColor='var(--danger)';
      const hint=document.createElement('p');
      hint.style.cssText='text-align:center;color:var(--danger);font-weight:600;margin-top:8px';
      hint.textContent=`Kunci jawaban: ${q.answer.n}/${q.answer.d}`;
      n.closest('.frac-input').after(hint);
    }
  }
  if(q.type==='word' && q.subs){
    q.subs.forEach((s,i)=>{
      const inputs=document.querySelectorAll(`[data-subinput="${i}"]`);
      const st=document.querySelector(`.sub-status[data-status="${i}"]`);
      if(s.answerType==='frac'){
        if(!fracMatch(inputs[0].value,inputs[1].value,s.answer,s.accept)){
          inputs[0].style.borderColor='var(--danger)';inputs[1].style.borderColor='var(--danger)';
          st.textContent=`kunci: ${s.answer.n}/${s.answer.d}`;st.style.background='var(--danger-light)';st.style.color='#991b1b';
        } else {st.textContent='✓ benar';st.className='sub-status done';}
      } else {
        if(normalizeText(inputs[0].value)!==normalizeText(s.answer)){
          inputs[0].style.borderColor='var(--danger)';
          st.textContent=`kunci: ${s.answer}`;st.style.background='var(--danger-light)';st.style.color='#991b1b';
        } else {st.textContent='✓ benar';st.className='sub-status done';}
      }
    });
  }
}

function showFeedback(kind,title,msg){
  const fb=$('#feedback');
  fb.className='feedback show '+(kind==='correct'?'correct':'wrong');
  fb.innerHTML=`<span class="emoji">${kind==='correct'?'🎉':'⚠️'}</span><div><strong>${title}</strong>${msg}</div>`;
}

function getAnswerKey(q){
  if(q.type==='mc') return q.options[q.correct];
  if(q.type==='tf') return q.answer?'Benar':'Salah';
  if(q.type==='frac') return `${q.answer.n}/${q.answer.d}`;
  if(q.type==='compare') return q.subs.map(s=>`${s.left.n}/${s.left.d} ${s.answer} ${s.right.n}/${s.right.d}`).join('; ');
  if(q.type==='order') return q.subs.map(s=>s.answer.replace(/,/g,' < ')).join('; ');
  if(q.type==='word' && q.subs) return q.subs.map(s=>s.answerType==='frac'?`${s.answer.n}/${s.answer.d}`:s.answer).join('; ');
  return '-';
}

/* ===================== NEXT / FINISH ===================== */
function goNext(){
  // siswa tidak bisa lanjut jika soal sebelumnya belum selesai (belum benar / belum 2x salah)
  const rec=state.answers[state.current];
  if(!rec || rec.correct===undefined){
    // belum diperiksa sama sekali
    showFeedback('wrong','⚠️','Periksa jawabanmu dulu sebelum lanjut!');
    return;
  }
  // jika benar -> boleh lanjut. jika salah 2x -> juga boleh lanjut (sudah diakomodasi di checkAnswer)
  state.current++;
  if(state.current>=QUESTIONS.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  // hitung total
  let total=0;
  state.answers.forEach(a=>{ if(a && a.score) total+=a.score; });
  state.totalScore=total;

  $('#quizArea').classList.add('hidden');
  $('#resultArea').classList.remove('hidden');
  $('#finalScore').textContent=total;

  // pesan sesuai skor
  let emoji,title,detail;
  const pct=total/100*10; // 0-10
  if(total>=90){emoji='🏆';title='Luar Biasa!';}
  else if(total>=75){emoji='🎉';title='Kerja Bagus!';}
  else if(total>=60){emoji='👍';title='Bagus, Terus Berlatih!';}
  else if(total>=40){emoji='💪';title='Ayo Semangat Lagi!';}
  else {emoji='🌱';title='Jangan Menyerah, Coba Lagi!';}
  $('#resultEmoji').textContent=emoji;
  $('#resultTitle').textContent=title;

  let correctCount=0, retryCount=0, wrongCount=0;
  state.answers.forEach(a=>{
    if(!a) return;
    if(a.correct && !a.usedRetry) correctCount++;
    else if(a.correct && a.usedRetry) retryCount++;
    else wrongCount++;
  });
  $('#resultDetail').innerHTML=`<b>${state.studentName}</b> — ${state.studentClass}<br>
    ✅ Benar langsung: ${correctCount} soal &nbsp;•&nbsp;
    🔄 Benar setelah mengulang: ${retryCount} soal &nbsp;•&nbsp;
    ❌ Salah: ${wrongCount} soal<br>
    <span style="font-size:.85rem;color:var(--muted)">Setiap pengulangan yang berhasil mengurangi 2 poin dari nilai soal tersebut.</span>`;

  // review list
  let reviewHtml='';
  QUESTIONS.forEach((q,i)=>{
    const a=state.answers[i]||{};
    let st='',cls='';
    const cond1 = (a.correct && !a.usedRetry);
    const cond2 = (a.correct && a.usedRetry);
    const cond3 = (a.attempts>=2);
    if(cond1){st='Benar (penuh)';cls='ok';}
    else if(cond2){st=`Benar (ulang, -2) → ${a.score}/${q.poin}`;cls='retry';}
    else if(cond3){st='Salah';cls='no';}
    else {st='-';cls='no';}
    reviewHtml+=`<div class="review-item"><span>Soal ${i+1} — ${q.tipeLabel}</span><span class="rstatus ${cls}">${st} (${a.score||0}/${q.poin})</span></div>`;
  });
  $('#reviewList').innerHTML=reviewHtml;
}

/* ===================== RESTART ===================== */
$('#restartBtn').addEventListener('click',()=>{
  state.current=0;state.answers=[];state.totalScore=0;
  $('#resultArea').classList.add('hidden');
  $('#identityCard').classList.remove('hidden');
  $('#studentName').value='';$('#studentClass').value='';
  // reset progress
  $('#progressFill').style.width='0%';
});

/* Enter key on identity -> start */
$('#studentName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click();});
